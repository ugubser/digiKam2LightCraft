[package]
name = "digikam2lightcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Replayable, metadata-preserving digiKam to LightCraft migration"

[dependencies]
lightcraft-engine = { git = "https://github.com/storytold/lightcraft", rev = "d999e382bafbb5d5c54482fdb1d11f6a63bfdf69" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roxmltree = "0.20"
anyhow = "1"
rayon = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
